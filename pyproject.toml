[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fakeprot"
version = "0.2.0"
description = "Generate artificial protein families by simulating protein evolution."
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Lucas Carrijo de Oliveira", email = "lucas@ebi.ac.uk" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "biopython>=1.83",
    "networkx>=3.2",
    "pandas>=2.2",
]

[project.scripts]
fakeprot = "fakeprot.cli:main"

[tool.pytest.ini_options]
testpaths = ["fakeprot/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
